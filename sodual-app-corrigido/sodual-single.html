<script>const $=s=>document.querySelector(s),E=s=>String(s??'').replace(/[&<>"]/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[m])),rnd=n=>1+Math.floor(Math.random()*n),uid=()=>Math.random().toString(36).slice(2,10);

const ORI_DESC={'Nobre':'Pessoa criada em uma família de posição social elevada, familiarizada com ambientes de influência e relações entre casas importantes.','Linhagem Militar':'Pessoa formada em um ambiente familiar de disciplina e tradição militar, com contato com a organização do serviço e do combate.','Camponês':'Pessoa que cresceu em comunidade rural e conviveu com rotinas de trabalho físico e atividades práticas.','Família Mercante':'Pessoa criada junto a atividades de comércio, negociação, circulação de produtos e relações mercantis.','Submundo':'Pessoa que teve sua formação pessoal próxima a redes informais ou atividades clandestinas.','Filho dos Marcados':'Descendente de participantes da traição ocorrida há aproximadamente dez anos, poupado das punições aplicadas aos adultos envolvidos. Carrega o estigma da família, mas a origem não determina culpa, caráter nem escolhas.','Erudito':'Pessoa criada em um contexto que valorizou estudos, pesquisa, documentação e aprendizagem intelectual.','Aprendiz de Ofício':'Pessoa que passou parte de sua juventude aprendendo uma atividade manual ou técnica.','Aprendiz de Curandeiro':'Pessoa que teve contato com cuidados básicos de saúde e práticas de tratamento.','Criado pela Fé':'Pessoa formada em ambiente religioso e familiarizada com crenças e ensinamentos de sua comunidade (em Bevon, predomina a fé na Mãe).','Fronteiriço':'Pessoa que cresceu próxima a áreas de risco ou regiões de fronteira, em contato com as exigências desse ambiente.','Marinheiro':'Pessoa com trajetória ligada a embarcações e ao cotidiano da navegação.','Nômade ou Viajante':'Pessoa criada em deslocamentos frequentes ou na convivência com diferentes lugares.','Caçador':'Pessoa familiarizada com observação de animais e atividades de rastreamento.','Prodígio':'Pessoa que manifestou facilidade excepcional em alguma área desde cedo, sem possuir automaticamente domínio universal.','Criado em Instituição':'Pessoa que cresceu em abrigo ou outro ambiente coletivo de convivência organizada.','Criado entre Cavaleiros':'Pessoa que passou parte de sua vida próxima a cavaleiros e à tradição dracônica de Bevon.'};

const ORI_PER={};
const NUC=['Preto','Vermelho Escuro','Vermelho Sólido','Vermelho Claro','Laranja'];
const RG={cabeca:['Cabeça',0],tronco:['Tronco',0],bd:['Braço direito',1],be:['Braço esquerdo',1],pd:['Perna direita',1],pe:['Perna esquerda',1]};
const GN=['Saudável','Leve','Intermediário','Alto','Grave','Fatal'],PEN=[0,0,-1,-2,-3,-3],GC=['#6f8f62','#b9a23c','#d08a2e','#c4552f','#8e1f2a','#2b1114'];
const NEED={1:[2,3],2:[2,3],3:[2,2],4:[2,2]},POS={Ofensiva:[0,0],Neutra:[2,0],Defensiva:[3,2]};
const PEND=['Regra da mesa (proprietário do projeto): a reserva inicial de mana usa os dados raciais no valor máximo (Sáelios 24, Arveni 20, Dárnios 16) + Corpo, no lugar da rolagem descrita no livro.','Estágio inicial do núcleo: o livro confirma que a sequência começa em Preto, mas não fixa o estágio de quem é criado. A ficha nova deixa o campo “não registrado” para a mesa definir.','Idade: Blackwood aceita ingresso a partir dos 18 anos; isso não é uma idade mínima para criar personagem.','Pacotes das origens (perícias, arma, habilidade, dinheiro, equipamentos) não estão no livro: ajuste perícias manualmente na ficha.','Não há pontos de vida: o livro usa ferimentos por região (graus Leve a Fatal), por isso a silhueta mostra grau e impactos, não PV.','Gravidade inicial do ferimento e tabela de dano não estão fixadas: você informa o grau do ferimento ao registrá-lo.','Interpretação adotada: ferimento de grau maior que o atual define o grau; igual ou menor soma 1 impacto na progressão da tabela.','Tratamento, estabilização e tempo de sobrevivência do estado Fatal não são regras fechadas.','Armaduras: mecânica suspensa nesta edição (sem bônus).','Dificuldades de testes ficam a critério do mestre.','Cinete, grimório, equipamentos e preços: sem regras numéricas; campos livres.'];

const VER=3,NARR=[['conceito','Conceito do personagem'],['aparencia','Aparência'],['objetivos','Objetivos'],['obs','Observações pessoais']];
const LS='sodual.v1',DEF=()=>({v:VER,chars:[],net:{pos:{},edges:[],people:[]},set:{col:0,theme:"auto",ac:"#7b4be8",nome:"Viajante",img:""}});
/* Normaliza/migra qualquer objeto de dados (carga inicial e restauração de backup). Nunca descarta dados do usuário sem necessidade. */
function norm(o){const d=Object.assign(DEF(),o&&typeof o=='object'?o:{});d.chars=Array.isArray(d.chars)?d.chars:[];d.net=Object.assign({pos:{},edges:[],people:[]},d.net||{});d.net.pos=d.net.pos||{};d.net.edges=Array.isArray(d.net.edges)?d.net.edges:[];d.net.people=Array.isArray(d.net.people)?d.net.people:[];d.set=Object.assign(DEF().set,d.set||{});
 if(d.chars.length>1){d.chars.slice(1).forEach(c=>{if(!d.net.people.some(p=>p.id==c.id))d.net.people.push({id:c.id,nome:c.nome,cor:c.cor||"#5ee7ff",img:c.img||""})});d.chars=d.chars.slice(0,1)}
 d.chars.forEach(c=>{c.hist=c.hist||{t:"",html:""};c.bag=c.bag||[];c.magias=c.magias||[];c.habs=c.habs||[];c.sk=c.sk||{};c.money=c.money||[0,0,0];c.w=c.w||{};
  /* v3: só acrescenta campos ausentes. Reserva (manaMax/mana), núcleo e textos existentes nunca são recalculados nem sobrescritos. */
  const n=c.narr&&typeof c.narr=='object'?c.narr:{};c.narr=Object.fromEntries(NARR.map(([k])=>[k,typeof n[k]=='string'?n[k]:'']).concat(Object.entries(n).filter(([k])=>!NARR.some(x=>x[0]==k))));if(c.nucleo==null)c.nucleo=''});
 ["folders","camp","bes","diario","arsenal"].forEach(k=>delete d[k]);d.v=VER;return d}
let S=DEF(),RAW=null;try{RAW=localStorage.getItem(LS);if(RAW){const p=JSON.parse(RAW);const old=(p.v||1)<VER;if(old)try{localStorage.setItem(LS+'.bak',RAW)}catch(e){}S=norm(p);if(old)try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}}catch(e){try{localStorage.setItem(LS+'.corrupt',RAW||'')}catch(_){}S=DEF()}
/* Migração: ficha única + pessoas da rede independentes */

let ui={net:{sel:null,edge:null,link:true,k:1,x:0,y:0,dying:null,newId:null},view:"lore",id:null,tab:'ficha',reg:'cabeca',w:null,step:0,pdf:'',rl:{a:'des',s:'Luta',m:0,reg:'',def:0}};

const usage=()=>{let n=0;try{n=new Blob([localStorage.getItem(LS)||'']).size}catch(e){}return n}

function roll(a,skill,mod){const sk=(cur()?.sk||{})[skill]||0,n=+a;let d=[];const c=Math.max(n,2);for(let i=0;i<(n>0?n:2);i++)d.push(rnd(20));const k=n>0?Math.max(...d):Math.min(...d);return{d,k,sk,mod:+mod,t:k+sk+ +mod,n}}
function pen(c,r){return c.w[r].amp?-3:PEN[c.w[r].g]}
const fatal=c=>Object.values(c.w).some(x=>x.g==5);

 if(other&&g>=3){c.dead=true;L('Ferimento '+GN[g]+' com outra região Fatal: MORTE IMEDIATA');return}
 if(w.g==5&&l&&g<=2){const x=rnd(4);if(x==4){w.amp=1;L('1D4=4: membro amputado')}else L('1D4='+x+': sem amputação');return}
 if(w.g==5){L('Impacto em região Fatal');return}
 if(g>w.g){w.g=g;w.h=0;L('Ferimento '+GN[g])}else{w.h++;const n=NEED[w.g][l];L('Impacto '+w.h+'/'+n+' em '+GN[w.g]);if(w.h>=n){w.g++;w.h=0;L('Agravou para '+GN[w.g])}}}

<script>/* ===== Criação de personagem — regras, cálculos e validação (independente da interface) =====
   Fonte: Livro I, ed. 0.3, caps. 10, 13, 14, 16 e 17.
   Exceção (regra da mesa definida pelo proprietário do projeto): a reserva inicial de mana NÃO é rolada;
   os dados raciais contam no valor máximo (D4 = 4) e soma-se o Corpo.
   Depende de rules.js (AT, AN, PV, ORI, ORI_PER, NARR, RG, uid). Não acessa DOM nem localStorage. */
const ETAPAS=['Identidade','Atributos','Reserva de mana','Perícias raciais','Habilidade racial','Origem','Revisão'];
const ETAPA={identidade:0,atributos:1,mana:2,pericias:3,habilidade:4,origem:5,revisao:6};
const ATR_REGRA={inicial:1,extras:4,total:9,max:5,zerosMax:1};
const MANA_REGRA_ID='dados-no-maximo';

/* --- Reserva inicial de mana (regra da mesa) --- */
const manaBase=povo=>PV[povo]?PV[povo].d*4:null;
/* Retorna o detalhamento do cálculo ou null se povo/Corpo ainda não permitem calcular. */
function calcManaInicial(povo,corpo){const b=manaBase(povo);if(b==null||!Number.isInteger(corpo)||corpo<0)return null;
 return{regra:MANA_REGRA_ID,dados:PV[povo].d+'D4',base:b,corpo,total:b+corpo}}

/* --- Rascunho --- */
const newW=()=>({nome:'',idade:'',povo:'',a:{for:1,des:1,cor:1,car:1,int:1},per:[],hab:'',origem:'',narr:{conceito:'',aparencia:'',historia:'',objetivos:'',obs:''}});
const err=(etapa,campo,codigo,msg)=>({etapa,campo,codigo,msg});
const isInt=v=>typeof v=='number'&&Number.isInteger(v);

/* --- Atributos --- */
function resumoAtributos(a){a=a||{};const vals=AT.map(([k])=>a[k]),soma=vals.reduce((s,v)=>s+(isInt(v)?v:0),0),zeros=AT.filter(([k])=>a[k]===0).map(([k])=>k);
 return{soma,zeros,restantes:ATR_REGRA.total-soma}}
function validateAttributes(a){const e=[],E1=(c,k,m)=>e.push(err(ETAPA.atributos,k?'a.'+k:'a',c,m));
 if(!a||typeof a!='object'){E1('ATR_AUSENTES','', 'Atributos não informados.');return e}
 AT.forEach(([k,n])=>{const v=a[k];if(!isInt(v))E1('ATR_INVALIDO',k,n+' tem um valor inválido; use um número inteiro de 0 a '+ATR_REGRA.max+'.');
  else if(v<0)E1('ATR_NEGATIVO',k,n+' não pode ser negativo.');
  else if(v>ATR_REGRA.max)E1('ATR_ACIMA_MAX',k,n+' está em '+v+'; o limite na criação é '+ATR_REGRA.max+'.')});
 const{soma,zeros,restantes}=resumoAtributos(a);
 if(zeros.length>ATR_REGRA.zerosMax)E1('ATR_ZEROS','', 'Só um atributo pode ser reduzido a 0; há '+zeros.length+' ('+zeros.map(k=>AN[k]).join(', ')+').');
 if(restantes>0)E1('ATR_PONTOS_RESTANTES','', 'Falta distribuir '+restantes+' ponto(s): a soma dos atributos deve ser '+ATR_REGRA.total+' (está em '+soma+').');
 if(restantes<0)E1('ATR_PONTOS_EXCEDIDOS','', 'Há '+(-restantes)+' ponto(s) a mais: a soma dos atributos deve ser '+ATR_REGRA.total+' (está em '+soma+').');
 return e}
/* Pode subir/descer um atributo pela interface sem violar as regras? (o rascunho é sempre revalidado ao salvar) */
function podeAlterarAtributo(a,k,delta){const v=a[k],{zeros,restantes}=resumoAtributos(a);
 if(delta>0)return v<ATR_REGRA.max&&restantes>0;
 if(delta<0)return v>1||(v==1&&zeros.length<ATR_REGRA.zerosMax);return false}

/* --- Identidade --- */
function validateIdentity(w){const e=[],I=(c,f,m)=>e.push(err(ETAPA.identidade,f,c,m));
 if(!String(w.nome??'').trim())I('NOME_AUSENTE','nome','Informe o nome do personagem.');
 const id=w.idade;if(id===''||id==null)I('IDADE_AUSENTE','idade','Informe a idade do personagem.');
 else if(!isInt(id)||id<0)I('IDADE_INVALIDA','idade','A idade deve ser um número inteiro (0 ou mais).');

<script>/* Lore de Sodual — Livro I, Edição 0.3 (reescrita própria; nada além do que o livro estabelece) */
const LORE=[
{id:'continente',c:'Mundo',ic:'map',t:'O continente de Sodual',p:['Sodual é o continente em que se passa toda a ambientação. Dois grandes reinos se destacam: Bevon, a oeste, e Morgot, a leste, ambos com peso histórico e tradições militares próprias.','A rivalidade entre eles atravessa gerações, mas o livro não a transforma numa disputa entre virtude e maldade.','A geografia reúne florestas, montanhas, desertos, regiões geladas, pântanos, lagos, rios e arquipélagos. Muitas localidades menores ainda não têm nome oficial, e o mapa foi preservado sem fronteiras ou nomes inventados.'],img:'mapa',cap:'Mapa original de Sodual (edições anteriores): Bevon a oeste, Morgot a leste.'},
{id:'bevon',c:'Mundo',ic:'shield',t:'O Reino de Bevon',p:['Bevon é o nome do reino e também o da capital, onde fica o Castelo de Bevon, ligado à autoridade governante.','A tradição dos cavaleiros de dragões molda o prestígio militar, a formação dos jovens e a memória política do reino. Perto da capital estão a Academia Militar Blackwood e uma enorme cratera florestada que serve de santuário aos dragões.','A vida do reino vai além da guerra: há vilarejos, comunidades, escolas de formação geral e instituições para escribas, tecnologia, estudos teóricos de magia e medicina. A carreira militar é muito prestigiada, mas não é o único caminho.']},
{id:'morgot',c:'Mundo',ic:'flame',t:'Morgot e seus grifos',p:['Morgot ocupa o leste de Sodual e tem uma tradição militar ligada aos grifos e aos cavaleiros que os montam. Isso compõe o equilíbrio de forças do continente, mas não é uma cópia da relação entre Bevon e seus dragões.','Há referências ao desenvolvimento de diferentes subespécies de grifos; suas classificações, características físicas, capacidades mágicas e formas de vínculo ainda não estão estabelecidas.','Organização política, povos, instituições, cidades, costumes e práticas militares de Morgot não são definidos por analogia com Bevon, e a população oriental não é um bloco de antagonistas morais.']},
{id:'fundacao',c:'História',ic:'scroll',t:'Quatro séculos de Bevon',p:['Há cerca de quatrocentos anos, três reinos ocupavam a região, governados por soberanos dos povos Arveni, Dárnios e Sáelios. Diante de uma ameaça vinda do leste, associada ao poder hoje chamado Morgot, os três uniram seus domínios e nasceu Bevon.','A união criou uma identidade política comum sem apagar as três origens, e por isso o governo se reparte entre três linhagens reais. Os nomes dos fundadores e os detalhes militares da guerra original não fazem parte da história pública estabelecida.'],tb:{h:['Período','Acontecimento'],r:[['~400 anos atrás','União dos três reinos diante da ameaça oriental.'],['Ao longo dos séculos','Conflitos recorrentes entre Bevon e Morgot, com tréguas e interrupções.'],['~10 anos atrás','Revolta interna: parte dos bevonianos colabora com Morgot e permite a entrada de suas forças.'],['Tempo presente','Descendentes dos adultos executados atingem a idade de ingresso em Blackwood.']]}},
{id:'revolta',c:'História',ic:'skull',t:'A revolta e os Filhos dos Marcados',p:['Uma década atrás, grupos de bevonianos colaboraram com Morgot. A entrada de forças inimigas causou mortes e danos no território. Os adultos envolvidos foram executados; seus filhos foram poupados.','Esses jovens, os Filhos dos Marcados, carregam o estigma das famílias. Alguns têm cerca de dezoito anos e podem se apresentar a Blackwood, compartilhando a formação com descendentes de outras famílias. A origem não determina culpa, caráter, escolhas nem posição política.','O presente convive, assim, com duas memórias de conflito: a fundação do reino por necessidade de união e a lembrança próxima de uma traição interna. Ambas influenciam a ideia pública de lealdade e serviço, sem explicar as convicções de cada pessoa.']},
{id:'conselho',c:'História',ic:'user',t:'O Conselho dos Seis',p:['Bevon não tem um único rei. O Conselho dos Seis, formado por três casais reais (Arveni, Dárnio e Sáelio), exerce em conjunto a autoridade do reino. É o reflexo institucional da fundação: não uma associação de três países, mas a autoridade central de um reino único, em que cada casal representa a continuidade de uma linhagem histórica.'],tb:{h:['Linhagem','Representação no governo'],r:[['Arveni','Rei Arveni e rainha Arveni.'],['Dárnia','Rei Dárnio e rainha Dárnia.'],['Sáelia','Rei Sáelio e rainha Sáelia.']]},ex:[['Herdeiros, alianças e casamento','As linhagens valorizam casamentos com famílias nobres influentes, sobretudo ligadas ao serviço militar, mas isso é costume, não requisito. Quem assume a posição real traz o cônjuge ao título correspondente, mesmo sem nascimento nobre. Herdeiros podem ter reservas altas de mana, o que não lhes garante um dragão: dependem da escolha livre da criatura na Colheita.'],['Serviço militar, nobreza e prestígio','O prestígio de uma casa nasce de feitos, histórico de cavaleiros e contribuição à defesa, além de riqueza e alianças; terras, sozinhas, não definem valor social. Uma pessoa de origem comum pode alcançar reconhecimento nobre por serviços extraordinários, embora seja difícil.']]},
{id:'povos',c:'Povos',ic:'user',t:'Os três povos de Bevon',p:['Arveni, Dárnios e Sáelios vivem sob a mesma estrutura política. Suas características físicas e tendências de reserva mágica não definem personalidade, moral, profissão, destino, controle de mana nem desenvolvimento do núcleo. A expectativa de vida é próxima à humana.'],ex:[['Arveni','Aparência semelhante à dos humanos convencionais e constituição geralmente equilibrada, com muita diversidade individual. Em média, relação equilibrada entre capacidades corporais e reserva de mana.'],['Dárnios','Constituição compacta e robusta; entre homens adultos, a estatura média é de cerca de 1,60 m. Orelhas achatadas, comprimidas ou enrugadas, cabelos de tons incomuns, mãos e antebraços relativamente grandes. Tendência a maior aptidão física e reservas iniciais um pouco menores, sem limite absoluto.'],['Sáelios','Orelhas pontiagudas e olhos de cores variadas, inclusive incomuns. Em média, reservas de mana mais altas e constituição menos robusta, o que não implica controle superior, refinamento avançado ou núcleo mais desenvolvido.']],img:'darnio',cap:'Referência visual de um possível Dárnio; não é padrão obrigatório do povo.'},
{id:'sociedade',c:'Povos',ic:'folder',t:'Sociedade e vida cotidiana',p:['Moeda: cobre, prata e ouro, em conversão decimal (1 prata = 10 cobres; 1 ouro = 10 pratas = 100 cobres). Não existe lista universal de preços.','Transporte: cavalos e grandes lagartos de montaria em terra, embarcações na navegação. Dragões e grifos ocupam lugar singular nas tradições dos cavaleiros e não são transporte comum.','Tecnologia: Sodual não repete a Idade Média histórica. Há castelos, estradas e fortificações, mas também rádios e aparelhos de reprodução de som. Automóveis e telefones não fazem parte do modelo, e a disponibilidade detalhada desses recursos não é fixada.']},
{id:'fe',c:'Povos',ic:'heart',t:'A Mãe e as crenças',p:['A divindade mais venerada em Bevon é a Mãe. A fé é importante, mas mitologia, práticas e instituições religiosas ainda não têm descrição oficial aprofundada.','Dragões são respeitados por inteligência e poder, mas a maioria não os considera deuses; grupos minoritários os veneram como seres divinos, o que não é a crença predominante.']},
{id:'blackwood',c:'Academia',ic:'sword',t:'A Academia Militar Blackwood',p:['Blackwood é a instituição de referência na formação dos futuros cavaleiros de dragões de Bevon. A preparação é rigorosa e as provas podem causar ferimentos graves ou mortes.','O ingresso ocorre a partir dos dezoito anos e o curso regular dura três anos. Famílias ligadas ao serviço militar valorizam a formação, mas ela não é obrigatória a todos os nobres nem privilégio exclusivo da nobreza.'],tb:{h:['Ano','Etapa conhecida'],r:[['Primeiro','Ingresso, adaptação, provas iniciais e Colheita após os três primeiros meses para sobreviventes aptos.'],['Segundo','Continuidade do treinamento militar e mágico e do desenvolvimento progressivo.'],['Terceiro','Etapa final da formação, anterior à conclusão do curso.']]},ex:[['Entrada, castelo e alojamentos','A ligação entre a região da academia e a capital é uma travessia estreita e perigosa sobre um vão profundo. Os dormitórios ficam em setores do castelo, organizados por ano de formação e pela divisão entre homens e mulheres. Currículos, patentes internas, especializações e funções de instrutores não são regras fixas.'],['Quando o dragão não escolhe','O cadete pode sobreviver às provas e participar da Colheita sem receber marca. Existem possibilidades futuras de nova Colheita ou de aproximação com dragões que perderam cavaleiros, sempre dependentes da vontade da criatura.'],['Sigilo de Cinetes','Há registros de medidas de sigilo em Blackwood, incluindo medalhas que identificam casos cujas informações ficam reservadas a docentes e representantes autorizados. Isso não cria uma lista de habilidades proibidas.']]},
{id:'dragoes',c:'Dragões',ic:'flame',t:'Os dragões de Sodual',p:['Dragões não são propriedade da Coroa, da academia ou de famílias nobres. São seres inteligentes e independentes, capazes de vínculos individuais. Não usam a linguagem falada, mas têm interesses, temperamentos, vontades e formas próprias de comunicação.','Todas as espécies têm quatro patas e duas asas, voam e servem de montaria. O tamanho vai de poucos metros a dezenas de metros, sem determinar inteligência ou poder. São onívoros, reproduzem-se sexualmente, põem ovos e podem viver perto de trezentos anos. Cada um tem reserva de mana e capacidades próprias, independentes das do cavaleiro.','A tradição de Bevon reconhece nove espécies. Seus nomes são classificações do cenário e não indicam afinidade elemental, personalidade, força, velocidade ou habilidades mágicas.'],tb:{h:['Espécie','Espécie','Espécie'],r:[['Coroados','Espinhais','Couraçados'],['Falciformes','Cristados','Presados'],['Serpentinos','Caudaleques','Rostrais']]},ex:[['Os Coroados','Distinguem-se por estruturas de múltiplos chifres ou ramificações na cabeça, semelhantes a coroas. A descrição detalhada das demais espécies não é tomada como definitiva a partir de seus nomes.'],['Escamas, cores e rumores','Dragões brancos são associados à tranquilidade, vermelhos à intensidade ou agressividade, negros à observação e vigilância. São crenças populares, não leis biológicas; nem cor nem espécie definem o Cinete do cavaleiro.']],img:'dragao',cap:'Ilustração dracônica da edição 0.2: referência visual, não especificação.'},
{id:'colheita',c:'Academia',ic:'check',t:'A Colheita e o vínculo',p:['Perto de Blackwood, uma grande cratera natural abriga uma floresta com centenas de dragões livres. Não é estábulo real nem criadouro militar; alguns vivem ali por longos períodos e outros retornam após a morte de um cavaleiro.','A Colheita ocorre após os três primeiros meses de formação. Cadetes sobreviventes e aptos entram na floresta em busca de contato. Aura, atitude, personalidade e capacidade física podem influenciar a aproximação, mas nenhuma impõe decisão: o encontro pode terminar em indiferença, ameaça, ataque ou escolha.','Quando um dragão escolhe uma pessoa, forma-se um vínculo individual e surge a marca dracônica. O grimório pode se manifestar então; o Cinete pode despertar de imediato ou ao longo de cerca de um dia, em geral como um “clique” intuitivo.'],ex:[['Independência dos dois seres','Dragão e cavaleiro mantêm suas vontades; o vínculo não dá ao humano direito de comando. Há uma ligação afetiva e empática que transmite emoções intensas, sem ser telepatia convencional. Um dragão não tem mais de um cavaleiro ao mesmo tempo. Após a morte do cavaleiro, pode ou não aceitar outro; o luto pode ser longo e alguns nunca voltam a se vincular.']]},
{id:'mana',c:'Magia',ic:'flame',t:'Mana, núcleos e canais',p:['Mana é a energia das manifestações mágicas. Humanos e outros humanoides sencientes têm um núcleo de mana no centro do abdômen, estrutura mágica de armazenamento que não é um órgão convencional. Canais de mana percorrem o corpo e conduzem a energia; núcleo e canais funcionam juntos, mas são estruturas distintas. A anatomia completa dos canais e os efeitos de lesões não têm regras universais.','A reserva é a quantidade de energia disponível. Muita mana não garante controle ou refinamento: quem tem grande reserva pode usá-la mal, e quem tem menos pode ser mais preciso.'],tb:{h:['Ordem','Estágio confirmado do núcleo'],r:[['1','Preto'],['2','Vermelho Escuro'],['3','Vermelho Sólido'],['4','Vermelho Claro'],['5','Laranja']]},ex:[['Controle, refinamento, aura e núcleo','Controle é a capacidade de manipular e dosar mana com precisão. Refinamento é a qualidade do trabalho com a mana, distinta de reserva e núcleo. Aura é a manifestação perceptível de características mágicas, tradicionalmente usada na avaliação. O núcleo é a estrutura de armazenamento, com desenvolvimento próprio. Aura e cor do núcleo não são equivalentes; em criaturas mágicas usa-se sobretudo a aura, sem escala única de aparência ou intensidade.'],['Sobre os estágios','Cores posteriores a Laranja aparecem em registros anteriores, mas sua sequência e efeitos não são definitivos nesta edição. Estágio superior não garante vitória, reserva maior nem domínio perfeito da magia.']]},
{id:'cinete',c:'Magia',ic:'book',t:'Cinetes e grimórios',p:['O Cinete é uma habilidade mágica individual despertada da relação entre uma pessoa e o dragão que a escolheu. Não é um poder pronto transferido da criatura: resulta da natureza, alma, ações, história, linhagem, reserva e desenvolvimento de mana do cavaleiro, somados à influência do dragão. Espécie do dragão e origem familiar não determinam o resultado; uma linhagem ligada ao fogo pode influenciar probabilidades, sem garantia.','Depois do despertar, a pessoa descobre novas aplicações da mesma manifestação por experiência, erro, treino e relação com o dragão. Não existe árvore universal de evolução, e a habilidade não permite qualquer efeito só porque há mana.'],ex:[['O grimório','Elemento mágico individual associado ao Cinete; pode ser convocado e dispensado, sem ser segurado como livro, e flutua perto do usuário, associado à aura. Começa com uma página ou habilidade inicial; novas páginas são outras aplicações do mesmo domínio, não poderes independentes, e surgem com o crescimento do personagem, sem intervalo fixo.'],['Magia geral e encantamentos','A mana também serve a práticas gerais: produzir uma pequena luz, reforçar o corpo, aprimorar a visão, perceber energia mágica. Encantamentos são prática especializada e exigente. Não há lista universal de feitiços, custos ou efeitos. Pessoas sem vínculo podem estudar magia, mas o uso intenso por elas gera receio social de degradação do núcleo, o que leva às Cascas.']]},
{id:'criaturas',c:'Criaturas',ic:'skull',t:'Criaturas e categorias de ameaça',p:['Sodual abriga criaturas mágicas de capacidade e periculosidade muito variadas. A classificação descreve o perigo de um indivíduo, não de toda a espécie, e segue a ordem E, D, C, B, A, S, SS, SS+. Ela não indica pontos de vida, estatísticas, nível de núcleo humano nem número de combatentes necessários; a aura é a referência importante para avaliar capacidades mágicas.'],tb:{h:['Categoria','Referência geral'],r:[['E','Muito fracas, como pequenos coelhos com chifres.'],['D','Já podem colocar pessoas comuns em perigo.'],['C','Relevantes para soldados de baixa patente.'],['B','Superior à C.'],['A','Superior à B.'],['S','Superior à A; ameaça excepcional.'],['SS','Superior à S; ameaça extrema.'],['SS+','Categoria máxima da escala conhecida.']]}},
{id:'cascas',c:'Criaturas',ic:'skull',t:'As Cascas',p:['Cascas são seres descritos como afetados por degradação severa do núcleo de mana, associada ao uso intenso de magia sem o vínculo que costuma sustentar essa prática, embora os registros não permitam transformar isso em regra universal.','Os relatos mencionam pele muito pálida, membros alongados, veias de mana evidentes, perda de cabelos, dentes afiados e alterações de consciência ou comportamento. São relatos, não estágios obrigatórios. Reversão, tratamento e consequências mecânicas não estão definidos.']},
{id:'barreira',c:'Criaturas',ic:'shield',t:'A Barreira de Bevon',p:['A proteção territorial de Bevon inclui um sistema defensivo mágico ligado a torres costeiras. Os registros descrevem cavaleiros dracônicos canalizando mana em escalas de serviço e cristais de âmbar que armazenam e conduzem a energia. A barreira serve para defender o reino de incursões e outras ameaças, inclusive Cascas.']},
{id:'bestiais',c:'Criaturas',ic:'flame',t:'Estados Bestiais',p:['Existem referências aos Estados Bestiais I e II, associados a vínculos com criaturas e não apenas com dragões. Condições de manifestação, efeitos e riscos não são regras fechadas neste volume, e o conceito não autoriza inventar benefícios.']},
{id:'ideia',c:'Síntese',ic:'star',t:'Uma ideia que atravessa Sodual',p:['Poder não é destino: é escolha, vínculo e consequência. A Coroa governa; os dragões escolhem. A origem de uma pessoa, a cor de um dragão ou a linhagem de uma casa não decidem sozinhas o que alguém será.','O livro também separa ambientação de mecânica: as diferenças entre os povos descrevem tendências de aparência e reserva mágica, e só as regras raciais afetam a criação de personagens.']},
{id:'lacunas',c:'Síntese',ic:'help',t:'Lacunas e pontos em aberto',p:['O livro não apresenta contradições diretas, mas deixa vários pontos propositalmente em aberto. Eles permanecem assim aqui, sem preenchimento inventado.'],ex:[['Geografia e história','Fronteiras e nomes de localidades menores; nomes dos fundadores e detalhes da guerra original; organização, povos, cidades e costumes de Morgot; classificação das subespécies de grifos.'],['Fé e sociedade','Mitologia, práticas e instituições ligadas à Mãe; preços de bens e serviços; disponibilidade detalhada de rádios e aparelhos de som.'],['Dragões e magia','Características das oito espécies além dos Coroados; cores do núcleo após Laranja; anatomia dos canais e efeitos de lesões; tratamento e reversão das Cascas; Estados Bestiais I e II.'],['Regras','Pacotes de cada origem; procedimento de gravidade inicial dos ferimentos; tratamento do estado Fatal; armaduras (mecânica suspensa); dificuldades de testes (a critério do mestre).']]}];
const LCATS=[...new Set(LORE.map(e=>e.c))];
</script>
<script>/* Perfil, História, Mochila, Magias e Habilidades */
const IMGOK=['image/jpeg','image/png','image/webp','image/gif'],MAXMB=25,me=()=>S.chars[0];
const MAXIN=25;
/* Valida, recorta (quadrado centralizado), redimensiona e comprime em JPEG até caber em ~lim bytes, para não estourar o localStorage. */
function readImg(f,sz,cb,lim=70000){if(!f)return;if(!IMGOK.includes(f.type)){toast('Formato inválido. Use JPG, PNG, WebP ou GIF.');return}if(f.size>MAXIN*1048576){toast('Imagem acima de '+MAXIN+' MB. Escolha um arquivo menor.');return}const u=URL.createObjectURL(f),im=new Image();im.onload=()=>{URL.revokeObjectURL(u);const s=Math.min(im.width,im.height);if(!s){toast('Imagem inválida.');return}let z=sz,q=.86,out='';for(let i=0;i<8;i++){const cv=document.createElement('canvas');cv.width=cv.height=z;const x=cv.getContext('2d');x.fillStyle='#fff';x.fillRect(0,0,z,z);x.imageSmoothingQuality='high';x.drawImage(im,(im.width-s)/2,(im.height-s)/2,s,s,0,0,z,z);out=cv.toDataURL('image/jpeg',q);if(out.length*.75<=lim)break;if(q>.55)q-=.12;else z=Math.round(z*.82)}cb(out)};im.onerror=()=>{URL.revokeObjectURL(u);toast('Não foi possível ler a imagem.')};im.src=u}
const Modal=({t,onClose,children})=>{React.useEffect(()=>{const f=e=>e.key=='Escape'&&onClose();addEventListener('keydown',f);return()=>removeEventListener('keydown',f)});return h`<div class="mdl" onClick=${onClose}><${MD} class="mb" role="dialog" aria-modal="true" initial=${{opacity:0,y:20,scale:.97}} animate=${{opacity:1,y:0,scale:1}} onClick=${e=>e.stopPropagation()}><h2>${t}<button class="b i" style=${{marginLeft:'auto'}} onClick=${onClose} aria-label="Fechar"><${I} n="x" s=${16}/></button></h2>${children}<//></div>`};
const NoChar=({t})=>h`<${Empty} ic="scroll" t=${t||'Seu personagem ainda não nasceu'} d="Crie o personagem principal para abrir sua ficha, história, mochila, magias e habilidades." cta="Iniciar criação" fn=${()=>{ui.w=newW();ui.step=0;go('wiz')}}/>`;
const Avatar=({img,s=34,ic=16})=>h`<span class="uav" style=${{width:s,height:s,backgroundImage:img?`url(${img})`:undefined}}>${!img&&h`<${I} n="user" s=${ic}/>`}</span>`;
const Profile=()=>{const[tmp,st]=React.useState(null),[ed,se]=React.useState(false),[nm,sn]=React.useState(''),[rm,sr]=React.useState(false),fi=React.useRef(),c=me(),u=S.set;
 const pick=e=>{readImg(e.target.files[0],360,st);e.target.value=''},commit=()=>{se(false);const v=nm.trim();if(v&&v!=u.nome)upd(()=>u.nome=v);toast('Nome atualizado')},
 SW=Object.entries(AC),TH=[['auto','Automático','monitor'],['dark','Escuro','moon'],['light','Claro','sun']];
 return h`<div class="pf"><input ref=${fi} type="file" accept="image/jpeg,image/png,image/webp,image/gif" hidden onChange=${pick}/>
 <section class="pf-hero"><div class="pf-ban" aria-hidden="true"></div>
  <div class="pf-id"><button class="pf-av" onClick=${()=>fi.current.click()} aria-label=${u.img?'Substituir foto de perfil':'Escolher foto de perfil'}><${Avatar} img=${u.img} s=${176} ic=${78}/><span class="pf-cam"><${I} n="camera" s=${18}/></span><span class="pf-ov">${u.img?'Substituir foto':'Escolher foto'}</span></button>
  <div class="pf-tx"><div class="tg">PERFIL LOCAL</div>
   ${ed?h`<input class="pf-in" autoFocus aria-label="Nome do usuário" value=${nm} maxLength=${40} onChange=${e=>sn(e.target.value)} onInput=${e=>sn(e.target.value)} onKeyDown=${e=>{if(e.key=='Enter')commit();if(e.key=='Escape')se(false)}} onBlur=${commit}/>`:h`<h1 class="pf-nm">${u.nome}<button class="b i" aria-label="Editar nome" onClick=${()=>{sn(u.nome);se(true)}}><${I} n="pen" s=${16}/></button></h1>`}
   <p class="pf-sub">${c?h`Jogando com <b>${c.nome}</b> · ${c.povo} · ${c.origem}`:'Nenhum personagem criado ainda'}</p>

 ${wipe&&h`<${Modal} t="Apagar tudo?" onClose=${()=>sw(false)}><p>Isso apaga <b>todos</b> os dados do SODUAL neste navegador e não pode ser desfeito.</p><div class="note">Considere exportar um backup antes.</div><div class="row"><${B} ic="down" onClick=${exp}>Exportar antes<//><${B} p ic="trash" onClick=${()=>{['','.bak','.prev','.corrupt'].forEach(k=>localStorage.removeItem(LS+k));location.reload()}}>Apagar definitivamente<//><${B} onClick=${()=>sw(false)}>Cancelar<//></div><//>`}</div>`};
const HELP=[['Meu personagem','Crie o personagem principal pelas 7 etapas. Antes de salvar, a ficha inteira é conferida (atributos, perícias, habilidade e origem conforme o livro); a revisão final aponta o que falta e leva direto à etapa. A reserva inicial de mana é calculada automaticamente (dados raciais no máximo + Corpo, regra desta mesa). Existe apenas uma ficha principal por usuário.'],['Ferimentos','Na ficha, toque numa região da silhueta, escolha o grau do ferimento e registre. O sistema aplica impactos, agravamento, penalidades, amputação e morte imediata segundo o livro. O livro não usa pontos de vida.'],['História, Mochila, Magias e Habilidades','São abas do personagem, salvas automaticamente. A História tem editor próprio; a Mochila é uma lista com quantidade e detalhes.'],['Rede de Conexões','Adicione pessoas sem criar fichas. Clique numa estrela e depois em outra para ligá-las; clique na linha para editar tipo, cor e descrição. Arraste para mover e use a roda do mouse para aproximar.'],['Dados e privacidade','Tudo é salvo neste navegador. Não há login, conta nem servidor. Em Configurações você exporta e restaura backups.'],['Teclado','Use Tab para navegar, Enter ou Espaço para ativar, e Esc para fechar janelas. As regiões da silhueta são focáveis e selecionáveis pelo teclado.']];

 <aside class="side"><h2>Pontos em aberto</h2>${PEND.map((p,i)=>h`<div class="note" key=${i}>${p}</div>`)}</aside></div>`};
